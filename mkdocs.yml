site_name: Fluid Power Systems Engineering - Mech and Hyd Sys
site_description: A hands-on fluid power course built around one real machine — a precision hydraulic lift platform.
site_author: Ali Bulent Koc
# Update site_url to match the GitHub Pages target before deploying:
site_url: https://alibulentkoc.github.io/fluid-power-curriculum/

# Authored relative links (assets/, demos/, quizzes/) resolve correctly with flat URLs.
use_directory_urls: false

theme:
  name: material
  font: false   # use system fonts (no Google Fonts fetch)
  palette:
    - scheme: default
      primary: teal
      accent: green
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/units.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/mathjax/tex-mml-chtml.js   # self-hosted (no CDN)
  - javascripts/units.js

